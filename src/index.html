<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CheckinAccess — Control plane</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CheckinAccess platform control plane for creating and managing tenants." />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="64x64" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #09090b;
      }
      .skip-link {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 10000;
        padding: 8px 12px;
        background: #09090b;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        transform: translateY(-150%);
      }
      .skip-link:focus {
        transform: none;
      }
      .boot-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }
      .boot-side {
        background: #09090b;
      }
      .boot-main {
        background: #fff;
        display: grid;
        place-items: center;
        color: #09090b;
        font: 650 1.5rem system-ui, 'Segoe UI', sans-serif;
      }
      @media (max-width: 900px) {
        .boot-screen {
          grid-template-columns: 1fr;
        }
        .boot-side {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <app-root>
      <div class="boot-screen" aria-busy="true" aria-label="Loading CheckinAccess">
        <div class="boot-side"></div>
        <div class="boot-main">CheckinAccess</div>
      </div>
    </app-root>
    <noscript>CheckinAccess requires JavaScript to run.</noscript>
  </body>
</html>
