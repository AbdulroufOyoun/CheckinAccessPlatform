<div class="lang-switch" [class.is-compact]="compact" role="group" [attr.aria-label]="'lang.label' | translate">
  <button type="button" [class.is-on]="locale.lang() === 'en'" (click)="setLang('en')">
    {{ 'lang.en' | translate }}
  </button>
  <button type="button" [class.is-on]="locale.lang() === 'ar'" (click)="setLang('ar')">
    {{ 'lang.ar' | translate }}
  </button>
</div>
